<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payout Reconciliation — Upload, Preview & Download</title>

  <!-- excel-viewer (npm package) — loads the package from the npm CDN -->
  <link rel="stylesheet" href="https://unpkg.com/excel-viewer@1.0.0/dist/excel/xspreadsheet.css" />
  <script src="https://unpkg.com/excel-viewer@1.0.0/dist/excel/xspreadsheet.js"></script>
  <script src="https://unpkg.com/excel-viewer@1.0.0/dist/excel/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/excel-viewer@1.0.0/dist/excel-viewer.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loading overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Processing, please wait…</div>
  </div>

  <div class="container">
    <header>
      <div class="dot" title="API connected"></div>
      <h1>Payout Reconciliation</h1>
    </header>

    <!-- Step 1: Upload CSVs -->
    <div class="card">
      <h2><span class="step">1</span> Upload CSV Files</h2>
      <p style="margin: 0 0 16px 0; color: var(--muted); font-size: 0.95rem;">
        Select the <strong>System</strong> and <strong>Bank</strong> CSV reports, then run reconciliation.
      </p>

      <div class="file-group">
        <label class="file-label" id="sysLabel">
          <span>📄 System CSV</span>
          <input type="file" id="systemFile" accept=".csv" />
          <span class="file-name" id="sysFileName">No file chosen</span>
        </label>
        <label class="file-label" id="bankLabel">
          <span>🏦 Bank CSV</span>
          <input type="file" id="bankFile" accept=".csv" />
          <span class="file-name" id="bankFileName">No file chosen</span>
        </label>
      </div>

      <!-- Uploaded files summary (shown after successful selection) -->
      <div id="uploadedSummary" class="uploaded-summary">
        <div class="uploaded-item" id="sysUploadedItem" style="display:none;">
          <span class="tick">✓</span>
          <span class="name" id="sysUploadedName"></span>
        </div>
        <div class="uploaded-item" id="bankUploadedItem" style="display:none;">
          <span class="tick">✓</span>
          <span class="name" id="bankUploadedName"></span>
        </div>
      </div>

      <button id="uploadBtn" class="btn btn-primary">Reconcile &amp; Upload</button>
    </div>

    <div id="status"></div>

    <!-- Step 2: Preview & Download -->
    <div id="previewSection" class="card">
      <h2><span class="step">2</span> Preview Reconciliation Report</h2>
      <p style="margin: 0 0 12px 0; color: var(--muted); font-size: 0.95rem;">
        Preview generated by <strong>excel-viewer</strong> (npm package). The report is fetched from the backend.
      </p>

      <div class="preview-wrap">
        <div id="excel-view"></div>
      </div>

      <div class="actions">
        <button id="downloadBtn" class="btn btn-download" disabled>⬇ Download Report (.xlsx)</button>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
